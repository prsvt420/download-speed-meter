[project]
name = "download-speed-meter"
version = "0.1.0"
description = "Консольная утилита для измерения скорости скачивания по указанному URL"
readme = "README.md"
authors = [
    { name = "Denis Tokarev", email = "wf.denis.tokarev@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.flake8]
max-line-length = 79
max-complexity = 10
exclude = [".venv"]
docstring-convention = "google"
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
select = ["E", "W", "F", "C", "B", "D", "N", "Q", "ERA", "S"]
ignore = ["W503", "D100", "D104", "D107"]
per-file-ignores = [
    "tests/*: S101",
    "scripts/run_mypy.py: S404, S603, S607"
]

[tool.isort]
profile = "black"
line_length = 79
skip = [".venv"]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "flake8-bandit>=4.1.1",
    "flake8-bugbear>=26.11.16",
    "flake8-docstrings>=1.7.0",
    "flake8-eradicate>=1.5.0",
    "flake8-pyproject>=1.2.4",
    "flake8-quotes>=3.4.0",
    "isort>=9.0.2",
    "pep8-naming>=0.15.1",
]
